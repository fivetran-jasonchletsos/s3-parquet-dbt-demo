# Kept inside the project dir on purpose; run dbt with --profiles-dir .
# so nothing touches ~/.dbt/profiles.yml.
# Defaults exist only so `dbt parse` succeeds offline; a live run requires
# real values in DATABRICKS_HOST, DATABRICKS_HTTP_PATH, DATABRICKS_TOKEN.
parquet_databricks_demo:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'example.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/placeholder') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'placeholder-token') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'main') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'jason_chletsos_parquet_demo') }}"
      threads: 4
